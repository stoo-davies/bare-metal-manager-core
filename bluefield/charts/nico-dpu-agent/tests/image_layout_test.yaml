suite: cert directory overrides
templates:
  - daemonset.yaml
tests:
  - it: should mount certs at /opt/forge in init container by default
    set:
      image:
        repository: test
        tag: test
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: nico-certs
            mountPath: /opt/forge

  - it: should mount certs at /opt/forge in main container by default
    set:
      image:
        repository: test
        tag: test
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nico-certs
            mountPath: /opt/forge

  - it: should hostPath-mount /opt/forge by default
    set:
      image:
        repository: test
        tag: test
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nico-certs
            hostPath:
              path: /opt/forge
              type: DirectoryOrCreate

  - it: should fall back to /opt/nico when certsDir is cleared
    set:
      image:
        repository: test
        tag: test
      certsDir: null
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: nico-certs
            mountPath: /opt/nico
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nico-certs
            mountPath: /opt/nico
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nico-certs
            hostPath:
              path: /opt/nico
              type: DirectoryOrCreate

  - it: should accept a custom certsDir value
    set:
      image:
        repository: test
        tag: test
      certsDir: /custom/cert/dir
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: nico-certs
            mountPath: /custom/cert/dir
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nico-certs
            hostPath:
              path: /custom/cert/dir
              type: DirectoryOrCreate

  - it: should mount the host lldpd socket writable in the main container
    set:
      image:
        repository: test
        tag: test
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: lldpd-socket
            mountPath: /run/lldpd.socket
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: lldpd-socket
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: lldpd-socket
            hostPath:
              path: /run/lldpd.socket
              type: Socket

  - it: should expose the host LLDP runtime only to the init container
    set:
      image:
        repository: test
        tag: test
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: host-lldpcli
            mountPath: /host/usr/sbin/lldpcli
            readOnly: true
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: host-lib
            mountPath: /host/lib
            readOnly: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: host-lldpcli
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: host-lib
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-lldpcli
            hostPath:
              path: /usr/sbin/lldpcli
              type: File
      - contains:
          path: spec.template.spec.volumes
          content:
            name: host-lib
            hostPath:
              path: /lib
              type: Directory
